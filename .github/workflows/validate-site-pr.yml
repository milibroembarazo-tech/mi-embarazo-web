name: Validate website PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site
        run: npm run validate

      - name: Test validator
        run: npm run test:validate

      - name: Test navigation
        run: npm run test:nav
